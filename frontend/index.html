<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRIT TeamFinder // УрФУ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <div>
                <h1>⚡ IRIT TeamFinder <span class="badge">УрФУ</span></h1>
                <p class="subtitle">Платформа быстрого поиска команды на хакатоны и пет-проекты</p>
            </div>
            <div class="status-indicator" id="apiStatus">● Локальный режим (Demo)</div>
        </div>
    </header>

    <main class="container main-grid">
        <section class="card form-section">
            <h2>Разместить анкету</h2>
            <form id="userForm">
                <div class="form-group">
                    <label for="name">Имя или никнейм</label>
                    <input type="text" id="name" placeholder="Например: Алексей (ИВТ-1)" required>
                </div>

                <div class="form-group">
                    <label for="role">Основная роль</label>
                    <select id="role" required>
                        <option value="Backend">Backend Developer</option>
                        <option value="Frontend">Frontend Developer</option>
                        <option value="Bot Dev">Bot & Integration Dev</option>
                        <option value="Algorithms">Algorithms & Data</option>
                        <option value="Product/Design">Product Analyst & Design</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="skills">Стек технологий (через запятую)</label>
                    <input type="text" id="skills" placeholder="Python, FastAPI, SQL, Docker" required>
                </div>

                <div class="form-group">
                    <label for="tg_username">Telegram (без @)</label>
                    <input type="text" id="tg_username" placeholder="username" required>
                </div>

                <button type="submit" class="btn btn-primary">Добавить в базу</button>
            </form>
        </section>

        <section class="list-section">
            <div class="list-header">
                <h2>Свободные участники</h2>
                <select id="roleFilter" class="filter-select">
                    <option value="ALL">Все роли</option>
                    <option value="Backend">Backend</option>
                    <option value="Frontend">Frontend</option>
                    <option value="Bot Dev">Bot Dev</option>
                    <option value="Algorithms">Algorithms</option>
                    <option value="Product/Design">Product/Design</option>
                </select>
            </div>
            <div id="usersGrid" class="users-grid"></div>
        </section>
    </main>

    <div id="matchModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h3>Результат AI-матчинга</h3>
            <div class="match-score" id="matchScore">89%</div>
            <p id="matchDetails" class="match-text"></p>
            <a id="modalTgLink" href="#" target="_blank" class="btn btn-primary">Написать в Telegram</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
